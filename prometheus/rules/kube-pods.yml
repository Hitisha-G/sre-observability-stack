groups:
  - name: kube-pods
    labels:
      team: platform
      component: kubernetes
    rules:
      - alert: KubePodCrashLooping
        expr: |
          max by (namespace, pod, container) (
            kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Container {{ $labels.container }} has been in CrashLoopBackOff continuously for more than 15 minutes."
          runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-pod-crash-looping.md"
