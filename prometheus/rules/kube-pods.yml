groups:
  - name: kube-pods.recording
    rules:
      # Pre-aggregate CrashLoopBackOff so the alert is a simple threshold on a recording rule.
      - record: sre:kube_pod_crashloop
        expr: |
          max by (namespace, pod, container) (
            kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
          )
      # One series per pod stuck outside Running/Succeeded. Job-owned pods are
      # excluded: a Failed Job pod is the Job controller's concern, not a stuck workload.
      - record: sre:kube_pod_not_ready
        expr: |
          max by (namespace, pod) (
            kube_pod_status_phase{phase=~"Pending|Unknown|Failed"} == 1
          )
          * on (namespace, pod) group_left()
            max by (namespace, pod) (kube_pod_owner{owner_kind!="Job"})
  - name: kube-pods
    labels:
      team: platform
      component: kubernetes
    rules:
      - alert: KubePodCrashLooping
        expr: |
          sre:kube_pod_crashloop == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Container {{ $labels.container }} has been in CrashLoopBackOff continuously for more than 15 minutes."
          runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-pod-crash-looping.md"
      - alert: KubePodNotReady
        expr: |
          sre:kube_pod_not_ready > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been not ready for 15 minutes"
          description: "Pod {{ $labels.pod }} has stayed in Pending, Unknown, or Failed phase for more than 15 minutes (Job pods excluded)."
          runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-pod-not-ready.md"
