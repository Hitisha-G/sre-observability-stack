groups:
  - name: kube-nodes.recording
    rules:
      # Pre-aggregate kube-state-metrics condition gauges so alerts stay readable.
      # One series per node: 1 when Ready is false or unknown, 0 otherwise.
      # Replaces separate ready / ready_unknown rules so the alert is a single threshold.
      - record: sre:kube_node_not_ready
        expr: |
          max by (node) (
            kube_node_status_condition{condition="Ready",status=~"false|unknown"}
          )
      - record: sre:kube_node_disk_pressure
        expr: |
          max by (node) (
            kube_node_status_condition{condition="DiskPressure",status="true"}
          )
  - name: kube-nodes
    labels:
      team: platform
      component: kubernetes
    rules:
      - alert: KubeNodeNotReady
        expr: |
          sre:kube_node_not_ready == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is NotReady"
          description: "Kubernetes node {{ $labels.node }} has been NotReady or Ready=unknown for more than 10 minutes."
          runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-node-not-ready.md"
      - alert: KubeNodeDiskPressure
        expr: |
          sre:kube_node_disk_pressure == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} reporting DiskPressure"
          description: "DiskPressure is true on {{ $labels.node }} for more than 5 minutes; pods may be evicted."
          runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-node-disk-pressure.md"
