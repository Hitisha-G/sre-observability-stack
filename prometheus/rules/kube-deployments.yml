groups:
  - name: kube-deployments.recording
    rules:
      # Pre-aggregate unavailable replicas so the alert expr stays a simple threshold.
      # Clamp at zero: during a surge rollout available can exceed desired, which
      # would otherwise record a negative "unavailable" count on dashboards.
      - record: sre:kube_deployment_replicas_unavailable
        expr: |
          clamp_min(
            max by (namespace, deployment) (
              kube_deployment_spec_replicas
              - on (namespace, deployment) group_left()
                kube_deployment_status_replicas_available
            ),
            0
          )
      # How many spec generations the Deployment controller has not yet observed.
      # A positive lag means spec changes are not being acted on (controller
      # stuck, paused, or the API object is churning faster than it reconciles).
      - record: sre:kube_deployment_generation_lag
        expr: |
          clamp_min(
            max by (namespace, deployment) (
              kube_deployment_metadata_generation
              - on (namespace, deployment) group_left()
                kube_deployment_status_observed_generation
            ),
            0
          )
  - name: kube-deployments
    labels:
      team: platform
      component: kubernetes
    rules:
      - alert: KubeDeploymentReplicasMismatch
        # Only page when the rollout has stopped moving: a slow but healthy
        # rollout (or an HPA scale-up) keeps bumping updated replicas, and a
        # truly stalled one is already covered by KubeDeploymentRolloutStuck.
        expr: |
          sre:kube_deployment_replicas_unavailable > 0
          and on (namespace, deployment)
          max by (namespace, deployment) (
            changes(kube_deployment_status_replicas_updated[10m])
          ) == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replica mismatch"
          description: "Available replicas have been below the desired count for longer than 15 minutes with no rollout progress in the last 10 minutes."
          runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-deployment-replicas-mismatch.md"
      - alert: KubeDeploymentRolloutStuck
        expr: |
          sre:kube_deployment_generation_lag > 0
          or on (namespace, deployment)
          max by (namespace, deployment) (
            kube_deployment_status_condition{condition="Progressing", status="false"} == 1
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} rollout is stuck"
          description: "The rollout has not progressed for longer than 15 minutes (observed generation lagging or Progressing=False, e.g. ProgressDeadlineExceeded)."
          runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-deployment-rollout-stuck.md"
