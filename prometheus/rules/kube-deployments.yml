groups:
  - name: kube-deployments.recording
    rules:
      # Pre-aggregate unavailable replicas so the alert expr stays a simple threshold.
      - record: sre:kube_deployment_replicas_unavailable
        expr: |
          max by (namespace, deployment) (
            (
              kube_deployment_spec_replicas
              - on (namespace, deployment) group_left()
                kube_deployment_status_replicas_available
            )
          )
  - name: kube-deployments
    labels:
      team: platform
      component: kubernetes
    rules:
      - alert: KubeDeploymentReplicasMismatch
        expr: |
          sre:kube_deployment_replicas_unavailable > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replica mismatch"
          description: "Available replicas have been below the desired count for longer than 15 minutes."
          runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-deployment-replicas-mismatch.md"
