# promtool unit tests for prometheus/rules/kube-hpa.yml.
# Run with: make promtool-test (or promtool test rules tests/promtool/*.test.yml)
rule_files:
  - ../../prometheus/rules/kube-hpa.yml

evaluation_interval: 1m

tests:
  # web stays at max past for: 15m and fires; api has headroom; batch is pinned
  # (min == max) and must never be recorded or alert.
  - interval: 1m
    input_series:
      - series: 'kube_horizontalpodautoscaler_status_current_replicas{namespace="shop",horizontalpodautoscaler="web"}'
        values: '10x30'
      - series: 'kube_horizontalpodautoscaler_spec_max_replicas{namespace="shop",horizontalpodautoscaler="web"}'
        values: '10x30'
      - series: 'kube_horizontalpodautoscaler_spec_min_replicas{namespace="shop",horizontalpodautoscaler="web"}'
        values: '2x30'
      - series: 'kube_horizontalpodautoscaler_status_current_replicas{namespace="shop",horizontalpodautoscaler="api"}'
        values: '4x30'
      - series: 'kube_horizontalpodautoscaler_spec_max_replicas{namespace="shop",horizontalpodautoscaler="api"}'
        values: '8x30'
      - series: 'kube_horizontalpodautoscaler_spec_min_replicas{namespace="shop",horizontalpodautoscaler="api"}'
        values: '2x30'
      - series: 'kube_horizontalpodautoscaler_status_current_replicas{namespace="jobs",horizontalpodautoscaler="batch"}'
        values: '3x30'
      - series: 'kube_horizontalpodautoscaler_spec_max_replicas{namespace="jobs",horizontalpodautoscaler="batch"}'
        values: '3x30'
      - series: 'kube_horizontalpodautoscaler_spec_min_replicas{namespace="jobs",horizontalpodautoscaler="batch"}'
        values: '3x30'
    promql_expr_test:
      - expr: sre:kube_hpa_at_max_replicas
        eval_time: 5m
        exp_samples:
          - labels: 'sre:kube_hpa_at_max_replicas{namespace="shop",horizontalpodautoscaler="api"}'
            value: 0
          - labels: 'sre:kube_hpa_at_max_replicas{namespace="shop",horizontalpodautoscaler="web"}'
            value: 1
    alert_rule_test:
      - eval_time: 10m
        alertname: KubeHpaMaxedOut
        exp_alerts: []
      - eval_time: 20m
        alertname: KubeHpaMaxedOut
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              component: kubernetes
              namespace: shop
              horizontalpodautoscaler: web
            exp_annotations:
              summary: "HPA shop/web is at maxReplicas"
              description: "The HorizontalPodAutoscaler has been running at its maxReplicas ceiling for more than 15 minutes and cannot scale out further under load."
              runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-hpa-maxed-out.md"

  # A short burst at max that scales back down before for: 15m does not fire.
  - interval: 1m
    input_series:
      - series: 'kube_horizontalpodautoscaler_status_current_replicas{namespace="shop",horizontalpodautoscaler="cart"}'
        values: '6x10 3x20'
      - series: 'kube_horizontalpodautoscaler_spec_max_replicas{namespace="shop",horizontalpodautoscaler="cart"}'
        values: '6x30'
      - series: 'kube_horizontalpodautoscaler_spec_min_replicas{namespace="shop",horizontalpodautoscaler="cart"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KubeHpaMaxedOut
        exp_alerts: []
