# promtool unit tests for prometheus/rules/kube-deployments.yml.
# Run with: make promtool-test (or promtool test rules tests/promtool/*.test.yml)
rule_files:
  - ../../prometheus/rules/kube-deployments.yml

evaluation_interval: 1m

tests:
  # Generation lag held past for: 15m fires; a lag that reconciles quickly does not.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_metadata_generation{namespace="shop",deployment="web"}'
        values: '4x30'
      - series: 'kube_deployment_status_observed_generation{namespace="shop",deployment="web"}'
        values: '3x30'
      - series: 'kube_deployment_metadata_generation{namespace="shop",deployment="api"}'
        values: '7x30'
      - series: 'kube_deployment_status_observed_generation{namespace="shop",deployment="api"}'
        values: '6x2 7x28'
    promql_expr_test:
      - expr: sre:kube_deployment_generation_lag
        eval_time: 10m
        exp_samples:
          - labels: 'sre:kube_deployment_generation_lag{namespace="shop",deployment="api"}'
            value: 0
          - labels: 'sre:kube_deployment_generation_lag{namespace="shop",deployment="web"}'
            value: 1
    alert_rule_test:
      - eval_time: 10m
        alertname: KubeDeploymentRolloutStuck
        exp_alerts: []
      - eval_time: 20m
        alertname: KubeDeploymentRolloutStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              component: kubernetes
              namespace: shop
              deployment: web
            exp_annotations:
              summary: "Deployment shop/web rollout is stuck"
              description: "The rollout has not progressed for longer than 15 minutes (observed generation lagging or Progressing=False, e.g. ProgressDeadlineExceeded)."
              runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-deployment-rollout-stuck.md"

  # ProgressDeadlineExceeded (Progressing=False) fires even when generations match.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_metadata_generation{namespace="payments",deployment="ledger"}'
        values: '2x30'
      - series: 'kube_deployment_status_observed_generation{namespace="payments",deployment="ledger"}'
        values: '2x30'
      - series: 'kube_deployment_status_condition{namespace="payments",deployment="ledger",condition="Progressing",status="false",reason="ProgressDeadlineExceeded"}'
        values: '1x30'
      - series: 'kube_deployment_status_condition{namespace="payments",deployment="ledger",condition="Progressing",status="true",reason="ProgressDeadlineExceeded"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KubeDeploymentRolloutStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              component: kubernetes
              namespace: payments
              deployment: ledger
            exp_annotations:
              summary: "Deployment payments/ledger rollout is stuck"
              description: "The rollout has not progressed for longer than 15 minutes (observed generation lagging or Progressing=False, e.g. ProgressDeadlineExceeded)."
              runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-deployment-rollout-stuck.md"

  # cart is under capacity with updated replicas flat, so the mismatch pages.
  # search rolls out slowly (one pod every 6m): unavailable stays positive for
  # 30m but updated replicas keep changing, so it must not page.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="shop",deployment="cart"}'
        values: '3x40'
      - series: 'kube_deployment_status_replicas_available{namespace="shop",deployment="cart"}'
        values: '1x40'
      - series: 'kube_deployment_status_replicas_updated{namespace="shop",deployment="cart"}'
        values: '3x40'
      - series: 'kube_deployment_spec_replicas{namespace="shop",deployment="search"}'
        values: '6x40'
      - series: 'kube_deployment_status_replicas_available{namespace="shop",deployment="search"}'
        values: '1x5 2x5 3x5 4x5 5x5 6x15'
      - series: 'kube_deployment_status_replicas_updated{namespace="shop",deployment="search"}'
        values: '1x5 2x5 3x5 4x5 5x5 6x15'
    promql_expr_test:
      - expr: sre:kube_deployment_replicas_unavailable
        eval_time: 20m
        exp_samples:
          - labels: 'sre:kube_deployment_replicas_unavailable{namespace="shop",deployment="cart"}'
            value: 2
          - labels: 'sre:kube_deployment_replicas_unavailable{namespace="shop",deployment="search"}'
            value: 2
    alert_rule_test:
      - eval_time: 10m
        alertname: KubeDeploymentReplicasMismatch
        exp_alerts: []
      - eval_time: 20m
        alertname: KubeDeploymentReplicasMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              component: kubernetes
              namespace: shop
              deployment: cart
            exp_annotations:
              summary: "Deployment shop/cart replica mismatch"
              description: "Available replicas have been below the desired count for longer than 15 minutes with no rollout progress in the last 10 minutes."
              runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-deployment-replicas-mismatch.md"
      - eval_time: 28m
        alertname: KubeDeploymentReplicasMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              component: kubernetes
              namespace: shop
              deployment: cart
            exp_annotations:
              summary: "Deployment shop/cart replica mismatch"
              description: "Available replicas have been below the desired count for longer than 15 minutes with no rollout progress in the last 10 minutes."
              runbook_url: "https://github.com/Hitisha-G/sre-observability-stack/blob/main/docs/runbooks/kube-deployment-replicas-mismatch.md"
