name: ci

on:
  push:
    branches: [main]
    paths:
      - "prometheus/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "prometheus/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  alert-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ShellCheck and PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml
      - name: ShellCheck test scripts
        run: shellcheck tests/*.sh
      - name: Validate alert rule schema
        run: bash tests/alert_rules_schema_test.sh
      - name: Install promtool
        env:
          PROM_VERSION: "3.5.0"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" \
              "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/promtool" --version
      - name: Check Prometheus rules with promtool
        run: promtool check rules prometheus/rules/*.yml
