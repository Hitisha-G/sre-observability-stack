name: ci

on:
  push:
    branches: [main]
    paths:
      - "prometheus/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "prometheus/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflow files with actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - name: Install ShellCheck and PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml
      - name: ShellCheck test scripts
        run: make lint
      - name: Validate alert rule schema
        run: make test

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache promtool
        id: cache-promtool
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/promtool
          key: promtool-${{ runner.os }}-3.5.0
      - name: Install promtool
        if: steps.cache-promtool.outputs.cache-hit != 'true'
        env:
          PROM_VERSION: "3.5.0"
          PROM_SHA256: "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a"
        run: |
          mkdir -p "$HOME/.local/bin"
          archive="$(mktemp)"
          curl -fsSL \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            -o "$archive"
          echo "${PROM_SHA256}  ${archive}" | sha256sum -c -
          tar -xz -f "$archive" --strip-components=1 -C "$HOME/.local/bin" \
            "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          rm -f "$archive"
          chmod +x "$HOME/.local/bin/promtool"
      - name: Add promtool to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/promtool" --version
      - name: Check Prometheus rules with promtool
        run: make rules
      - name: Summarize validated rules
        if: always()
        run: |
          {
            echo "## Prometheus rules"
            echo
            shopt -s nullglob
            files=(prometheus/rules/*.yml prometheus/rules/*.yaml)
            if [[ ${#files[@]} -eq 0 ]]; then
              echo "_No rule files found._"
            else
              echo "Validated **${#files[@]}** file(s):"
              echo
              for f in "${files[@]}"; do
                echo "- \`$f\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: [lint, rules]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require lint and rules
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "rules=${{ needs.rules.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.rules.result }}" = "success"
